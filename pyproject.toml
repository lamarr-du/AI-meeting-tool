[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "meetmin"
version = "0.1.0"
description = "录音、转写、说话人分离与 AI 会议纪要命令行工具"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
meetmin = "meetmin.cli:main"

[project.optional-dependencies]
diar = ["speechbrain>=1.0.2", "scikit-learn>=1.3"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-PyYAML>=6,<7",
    "types-requests>=2,<3",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["meetmin*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_pipeline.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["meetmin", "main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
